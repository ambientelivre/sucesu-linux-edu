label expert
	menu label E^xpert install
	kernel /install.amd/vmlinuz
	append modules=debian-edu-install-udeb desktop=xfce priority=low vga=788 initrd=/install.amd/initrd.gz preseed/file=/cdrom/sucesu/sucesu.cfg --- 
include rqtxt.cfg
label auto
	menu label ^Automated install
	kernel /install.amd/vmlinuz
	append modules=debian-edu-install-udeb desktop=xfce auto=true priority=critical vga=788 initrd=/install.amd/initrd.gz preseed/file=/cdrom/sucesu/sucesu.cfg --- quiet 
