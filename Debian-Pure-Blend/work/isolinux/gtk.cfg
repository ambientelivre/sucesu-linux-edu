default installgui
label installgui
	menu label ^Graphical install
	menu default
	kernel /install.amd/vmlinuz
	append modules=debian-edu-install-udeb desktop=xfce vga=788 initrd=/install.amd/gtk/initrd.gz preseed/file=/cdrom/sucesu/sucesu.cfg --- quiet 

label sucesu-apagar
	menu label SUCESU: APAGAR DISCOS (formata)
	kernel /install.amd/vmlinuz
	append modules=debian-edu-install-udeb desktop=xfce vga=788 initrd=/install.amd/gtk/initrd.gz preseed/file=/cdrom/sucesu/apagar.cfg debian-installer/locale=pt_BR.UTF-8 keyboard-configuration/xkb-keymap=br --- quiet 

label sucesu-verificar
	menu label SUCESU: VERIFICAR DISCOS e HARDWARE
	kernel /install.amd/vmlinuz
	append modules=debian-edu-install-udeb desktop=xfce vga=788 initrd=/install.amd/gtk/initrd.gz preseed/file=/cdrom/sucesu/verificar.cfg debian-installer/locale=pt_BR.UTF-8 keyboard-configuration/xkb-keymap=br --- quiet 

