menu hshift 9
menu width 58

label expertdarkgui
	menu label Graphical expert install
	kernel /install.amd/vmlinuz
	append modules=debian-edu-install-udeb desktop=xfce priority=low vga=788 initrd=/install.amd/gtk/initrd.gz theme=dark preseed/file=/cdrom/sucesu/sucesu.cfg --- 
include rqdrkgtk.cfg
label autodarkgui
	menu label Graphical automated install
	kernel /install.amd/vmlinuz
	append modules=debian-edu-install-udeb desktop=xfce auto=true priority=critical vga=788 initrd=/install.amd/gtk/initrd.gz theme=dark preseed/file=/cdrom/sucesu/sucesu.cfg --- quiet 
