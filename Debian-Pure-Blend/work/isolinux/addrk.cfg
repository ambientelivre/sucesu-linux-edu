label expertdark
	menu label E^xpert install
	kernel /install.amd/vmlinuz
	append modules=debian-edu-install-udeb desktop=xfce priority=low vga=788 initrd=/install.amd/initrd.gz theme=dark preseed/file=/cdrom/sucesu/sucesu.cfg --- 
include rqdrk.cfg
label autodark
	menu label ^Automated install
	kernel /install.amd/vmlinuz
	append modules=debian-edu-install-udeb desktop=xfce auto=true priority=critical vga=788 initrd=/install.amd/initrd.gz theme=dark preseed/file=/cdrom/sucesu/sucesu.cfg --- quiet 
