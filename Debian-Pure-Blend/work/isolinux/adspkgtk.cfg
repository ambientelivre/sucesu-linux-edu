menu hshift 9
menu width 58

menu begin adspk
    menu label ^Speech-enabled advanced options
	menu title Speech-enabled advanced options
	label advancedmenu
	    menu label ^Back..
	    menu exit
	label expertspk
		menu label E^xpert speech install
		kernel /install.amd/vmlinuz
		append modules=debian-edu-install-udeb desktop=xfce priority=low vga=788 initrd=/install.amd/gtk/initrd.gz speakup.synth=soft preseed/file=/cdrom/sucesu/sucesu.cfg --- 
	include rqspkgtk.cfg
	label autospk
		menu label ^Automated speech install
		kernel /install.amd/vmlinuz
		append modules=debian-edu-install-udeb desktop=xfce auto=true priority=critical vga=788 initrd=/install.amd/gtk/initrd.gz speakup.synth=soft preseed/file=/cdrom/sucesu/sucesu.cfg --- quiet 
menu end
